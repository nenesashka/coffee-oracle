const moscowDate = new Intl.DateTimeFormat('ru-RU', {
  timeZone: 'Europe/Moscow',
  year: 'numeric',
  month: '2-digit',
  day: '2-digit',
});
const dayInMilliseconds = 86_400_000;
const seedKey = 'zavarilos-sign-seed';

function getPersonalSeed() {
  try {
    const saved = localStorage.getItem(seedKey);
    if (saved !== null && /^\d{1,10}$/.test(saved)) return Number(saved);
  } catch {}

  const seed = crypto.getRandomValues(new Uint32Array(1))[0];
  try { localStorage.setItem(seedKey, String(seed)); } catch {}
  return seed;
}

function dailySign(seed) {
  const date = Object.fromEntries(moscowDate.formatToParts(new Date()).map(({ type, value }) => [type, value]));
  const day = Date.UTC(+date.year,+date.month-1,+date.day) / dayInMilliseconds;
  const [title,text,stamp] = signs[(seed + day) % signs.length];
  return {title,text,stamp,date:date.day + '.' + date.month};
}

  }

  async function prepareShare() {
    shareRetry.hidden = true;
    try {
      shareAssets ??= loadShareAssets();
      const cardFonts = Promise.allSettled([
        document.fonts.load('700 120px "ZV Condensed"','ЗАВАРИЛОСЬ ' + currentSign.title + ' ' + currentSign.stamp),
        document.fonts.load('400 40px "Visuelt Pro"',currentSign.text),
      ]);
      const [images] = await Promise.all([
        shareAssets,
        Promise.race([cardFonts,new Promise(resolve => setTimeout(resolve,3000))]),
      ]);
      const layout = newCardLayout();
      if (layout.layers.some(layer => CARD_ASSET_FILES[layer.id] && layer.visible && !images[layer.id]) || !images.logo) {
        throw new Error('Missing card images');
      }
      const canvas = document.createElement('canvas');
      paintCard(canvas,layout,{
        ...currentSign,title:signTitle.textContent,stamp:signStamp.textContent
      },images);
      const blob = await cardPng(canvas);
      const file = new File([blob],'zavarilos.png',{type:'image/png'});
      sharePayload = {files:[file],text:shareCaption(currentSign)};
      const appleMobile = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
        (navigator.platform === 'MacIntel' && navigator.maxTouchPoints > 1);
      const imageOnly = {files:[file]};
      photoSavePayload = appleMobile && typeof navigator.share === 'function' &&
        navigator.canShare?.(imageOnly) === true ? imageOnly : undefined;
      const saveLabel = photoSavePayload ? 'Сохранить предсказание' : 'Скачать предсказание';
      predictionDownload.setAttribute('aria-label',saveLabel);
      predictionDownload.title = saveLabel;
      const url = URL.createObjectURL(file);
      shareDownload.href = predictionDownload.href = url;
      sharePreview.src = url;
      shareDownload.hidden = sharePreview.hidden = shareFileButton.hidden = predictionDownload.hidden = false;
      layout();
      shareFeedback.textContent = '';
    } catch {
      shareAssets = undefined;
      shareRetry.hidden = false;
      shareFeedback.textContent = 'Карточка пока недоступна. Можно повторить загрузку или скопировать подпись.';
    }
  }

  function showShareFallback() {
    shareText.value = shareCaption(currentSign);
    shareDialog.showModal();
  }
  async function openShare() {
    if (shareOpen) return;
    if (typeof navigator.share !== 'function') {
      showShareFallback();
      return;
    }
    shareOpen = true;
    try {
      const link = {url:shareUrl(currentSign)};
      if (navigator.canShare?.(link) === false) {
        showShareFallback();
        return;
      }
      await navigator.share(link);
    } catch (error) {
      if (error.name !== 'AbortError') showShareFallback();
    } finally {
      shareOpen = false;
    }
  }
  main.addEventListener('click',() => { if (view === 'result') openShare(); else if (view === 'hero') turn(); });
  predictionDownload.addEventListener('click',async event => {
    if (!photoSavePayload) return;
    event.preventDefault();
    if (shareOpen) return;
    shareOpen = true;
    try { await navigator.share(photoSavePayload); }
    catch (error) {
      if (error.name !== 'AbortError') {
        showShareFallback();
        shareFeedback.textContent = 'Зажми картинку и выбери сохранение в «Фото». Также можно скачать PNG.';
      }
    } finally { shareOpen = false; }
  });
  shareFileButton.addEventListener('click',async () => {
    if (shareOpen || !sharePayload) return;
    if (!navigator.share || navigator.canShare?.(sharePayload) === false) {
      shareFeedback.textContent = 'Скачай PNG и прикрепи его к сообщению.';
      return;
    }
    shareOpen = true;
    try { await navigator.share(sharePayload); }
    catch (error) {
      if (error.name !== 'AbortError') shareFeedback.textContent = 'Скачай PNG и прикрепи его к сообщению.';
    } finally { shareOpen = false; }
  });
  shareRetry.addEventListener('click',prepareShare);
  shareCopy.addEventListener('click',async () => {
    try {
      const item = new ClipboardItem({
        'text/plain':new Blob([shareText.value],{type:'text/plain'}),
        'text/html':new Blob([shareCaptionHtml(currentSign)],{type:'text/html'}),
      });
      await navigator.clipboard.write([item]);
      shareFeedback.textContent = 'Подпись скопирована';
    } catch {
      try {
        await navigator.clipboard.writeText(shareText.value);
        shareFeedback.textContent = 'Подпись скопирована';
      } catch {
        shareText.focus();
        shareText.select();
        shareFeedback.textContent = 'Подпись выделена для копирования';
      }
    }
  });
  const page = document.documentElement;
  const viewport = window.visualViewport;
  let viewportFrame;
  function fitViewport() {
    viewportFrame = undefined;
    // Keep browser chrome out of the layout without resizing the collage when zoomed.
    if (!viewport || Math.abs(viewport.scale - 1) > .01) return;
    const top = Math.max(0, Math.ceil(viewport.offsetTop));
    const bottom = Math.floor(viewport.height + viewport.offsetTop);
    if (bottom <= top) return;
    page.style.setProperty('--z5-visible-top', top + 'px');
    page.style.setProperty('--z5-visible-bottom', bottom + 'px');
  }
  function queueViewportFit() {
    viewportFrame ??= requestAnimationFrame(fitViewport);
  }
  function refitAfterReturn() {
    queueViewportFit();
    // Safari can settle its toolbar geometry after the first restored frame.
    setTimeout(queueViewportFit, 120);
    setTimeout(queueViewportFit, 400);
  }
  viewport?.addEventListener('resize', queueViewportFit);
  viewport?.addEventListener('scroll', queueViewportFit);
  window.addEventListener('resize', queueViewportFit);
  window.addEventListener('pageshow', refitAfterReturn);
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) refitAfterReturn();
  });
  const observer = new ResizeObserver(layout);
  observer.observe(stage);

  async function showCollage() {
    const sprite = new Image();
    sprite.src = document.getElementById('z5-cup-source').href;
    const fonts = Promise.allSettled([
      document.fonts.load('400 16px "Visuelt Pro"', 'Какой сегодня будет день?'),
      document.fonts.load('700 54px "ZV Condensed"', 'ЗАВАРИЛОСЬ'),
    ]);
    try {
      const plates = ['plate-blot.svg','plate-soft.svg'].map(file => {
        const asset = new Image();
        asset.src = './assets/' + file;
        return asset;
      });
      const fontDeadline = new Promise(resolve => setTimeout(resolve,3000));
      await Promise.all([Promise.race([fonts,fontDeadline]), ...[...root.querySelectorAll('img'),sprite,...plates].map(image => image.decode())]);
      await new Promise(resolve => {
        const deadline = setTimeout(resolve,180);
        requestAnimationFrame(() => requestAnimationFrame(() => {clearTimeout(deadline);resolve();}));
      });
      fitViewport();
      renderStable();
      root.inert = false;
      page.dataset.loadState = 'ready';
      shareAssets ??= loadShareAssets();
    } catch {
      page.dataset.loadState = 'error';
    } finally {
      clearTimeout(loadDeadline);
    }
  }
  fitViewport();
  showCollage();
})();
</script>

</body>
