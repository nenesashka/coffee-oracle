      <div class="z5-piece z5-spoon" data-piece="spoon" aria-hidden="true"><div class="z5-wiggle"><img class="z5-image" src="assets/spoon.avif" alt=""></div></div>
      <div class="z5-piece z5-eye" data-piece="eye" aria-hidden="true"><div class="z5-wiggle"><img class="z5-image" src="assets/eye.avif" alt=""></div></div>
      <div class="z5-piece z5-croissant" data-piece="croissant" aria-hidden="true"><div class="z5-wiggle"><img class="z5-image" src="assets/croissant.avif" alt=""></div></div>
      <div class="z5-piece z5-seal" data-piece="seal" aria-hidden="true"><div class="z5-wiggle"><img class="z5-image" src="assets/seal.avif" alt=""></div></div>
      <div class="z5-piece z5-arrow" data-piece="arrow" aria-hidden="true"><div class="z5-wiggle"><img class="z5-image" src="assets/arrow.avif" alt=""></div></div>
      <div class="z5-piece z5-danish" data-piece="danish"><div class="z5-wiggle"><img class="z5-image" src="assets/danish.avif" alt="Бумажная вырезка слойки с ягодами"></div></div>
      <div class="z5-piece z5-extra" data-piece="beans" data-extra="beans" data-active="false" aria-hidden="true"><div class="z5-wiggle"><img class="z5-image" src="assets/beans.avif" alt=""></div></div>
      <div class="z5-piece z5-extra" data-piece="checks" data-extra="checks" data-active="false" aria-hidden="true"><div class="z5-wiggle"><img class="z5-image" src="assets/checks.avif" alt=""></div></div>
      <div class="z5-piece z5-extra" data-piece="coffeeStamp" data-extra="coffeeStamp" data-active="false" aria-hidden="true"><div class="z5-wiggle"><img class="z5-image" src="assets/coffeeStamp.avif" alt=""></div></div>
      <div class="z5-cup" role="img" aria-label="Фотографическая бумажная кружка, наполненная кофе"><div class="z5-wiggle"><div class="z5-cup-frame" data-cup-frame="0"></div></div></div>
      <span class="z5-coffee-drop" aria-hidden="true"></span><span class="z5-coffee-drop" aria-hidden="true"></span><span class="z5-coffee-drop" aria-hidden="true"></span>
      </div>
      <section class="z5-result" aria-label="Предсказание на сегодня" hidden><div class="z5-result-paper">
        <div class="z5-result-meta"><span>ЛИЦЕЙ / ТВОЙ ЗНАК</span><span class="z5-date"></span></div>
        <h2 class="z5-sign-title"></h2>
        <p class="z5-sign-text"></p>
        <div class="z5-stamp"></div>
      </div></section>
    </div>
    <p class="z5-description">Какой сегодня будет день?</p>
    <div class="z5-actions"><button class="z5-button z5-main" type="button">Перевернуть кружку</button><button class="z5-button z5-back" type="button" hidden>Назад</button></div>
    <p class="z5-status" role="status" aria-live="polite"></p>
  </article>
</div>
<script type="module">
import { signs } from './assets/signs-v1.js';

const moscowDate = new Intl.DateTimeFormat('ru-RU', {
  timeZone: 'Europe/Moscow',
  year: 'numeric',
  month: '2-digit',
  day: '2-digit',
});
const dayInMilliseconds = 86_400_000;
const seedKey = 'zavarilos-sign-seed';

function getPersonalSeed() {
  try {
    const saved = localStorage.getItem(seedKey);
    if (saved !== null && /^\d{1,10}$/.test(saved)) return Number(saved);
  } catch {}

  const seed = crypto.getRandomValues(new Uint32Array(1))[0];
  try { localStorage.setItem(seedKey, String(seed)); } catch {}
  return seed;
}

function shuffleSigns() {
  const deck = signs.slice();
  for (let i = deck.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [deck[i], deck[j]] = [deck[j], deck[i]];
  }
  return deck;
}

function createSignDrawer() {
  const seed = getPersonalSeed();
  let lastDay;
  let previousSign;
  let deck = [];

  return () => {
    const date = Object.fromEntries(moscowDate.formatToParts(new Date()).map(({ type, value }) => [type, value]));
    const day = Date.UTC(+date.year, +date.month - 1, +date.day) / dayInMilliseconds;

    if (day !== lastDay) {
      lastDay = day;
      const dailySign = signs[(seed + day) % signs.length];
      deck = shuffleSigns().filter(sign => sign !== dailySign);
      deck.push(dailySign);
    } else if (deck.length === 0) {
      deck = shuffleSigns();
      const last = deck.length - 1;
      if (last > 0 && deck[last] === previousSign) [deck[last], deck[0]] = [deck[0], deck[last]];
    }

    previousSign = deck.pop();
    return { sign: previousSign, date: date.day + '.' + date.month };
  };
}

(() => {
  const root=document.getElementById('zavarilos-stop-motion-v6');
  const screen=root.querySelector('.z5-screen'), stage=root.querySelector('.z5-stage');
  const art=root.querySelector('.z5-art');
  const cup=root.querySelector('.z5-cup'), cupFrame=root.querySelector('.z5-cup-frame');
  const result=root.querySelector('.z5-result'), main=root.querySelector('.z5-main'), back=root.querySelector('.z5-back');
  const description=root.querySelector('.z5-description'), status=root.querySelector('.z5-status');
  const signTitle = result.querySelector('.z5-sign-title');
  const signText = result.querySelector('.z5-sign-text');
  const signStamp = result.querySelector('.z5-stamp');
  const signDate = result.querySelector('.z5-date');
  const drawSign = createSignDrawer();
  const extras=Array.from(root.querySelectorAll('.z5-extra'));
  const pieces=Object.fromEntries(Array.from(root.querySelectorAll('[data-piece]')).map(el=>[el.dataset.piece,el]));
  const reduced=window.matchMedia('(prefers-reduced-motion:reduce)');
  let view='hero';
  let spread=view==='result'?1:0, cycle=0, frameIndex=0, timers=[];
  const mix=(a,b)=>a+(b-a)*spread, clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
  function later(fn,ms){timers.push(setTimeout(fn,ms));}
  function clearTimers(){timers.forEach(clearTimeout);timers=[];}
  function layout(){
    const W=stage.clientWidth, pad=parseFloat(getComputedStyle(screen).paddingLeft), heroH=Math.max(370,W*1.14), openH=heroH+Math.max(128,W*.35+50), H=mix(heroH,openH);
    // Fit the animated artwork inside an independent, fixed-height slot.
    const availableHeight=stage.clientHeight;
    const scale=Math.min(1,availableHeight/H);
    const offset=(availableHeight-H*scale)/2;
    art.style.height=H+'px';
    art.style.transform='translateY('+offset+'px) scale('+scale+')';
    function place(el,x,y,w,h,angle=0,duration=1.7){
      const radians=(Math.abs(angle)+2)*Math.PI/180, ex=(w*Math.cos(radians)+h*Math.sin(radians)-w)/2+4, ey=(h*Math.cos(radians)+w*Math.sin(radians)-h)/2+4;
      x=clamp(x,8-pad+Math.max(0,ex),W+pad-8-w-Math.max(0,ex));y=clamp(y,8+Math.max(0,ey),H-h-8-Math.max(0,ey));
      Object.assign(el.style,{left:x+'px',top:y+'px',width:w+'px',height:h+'px'});
      const wiggle=el.querySelector('.z5-wiggle');if(wiggle){wiggle.style.setProperty('--z5-angle',angle+'deg');wiggle.style.setProperty('--z5-duration',duration+'s');}
      return{x,y,w,h};
    }
    const photoAngle = mix(-9, -13);
    const ph=place(pieces.photo,mix(W*.01,-W*.02),mix(heroH*.035,3),W*.35,W*.35/.75,photoAngle,1.9);
    const photoRotation = photoAngle * Math.PI / 180;
    const tapeWidth = ph.w * .59;
    const tapeHeight = tapeWidth / 2.2;
    // Anchor the tape to the tilted upper-right corner as the photo moves.
    const offsetX = ph.w * .38;
    const offsetY = -ph.h * .44;
    const tapeCenterX = ph.x + ph.w / 2 + offsetX * Math.cos(photoRotation) - offsetY * Math.sin(photoRotation);
    const tapeCenterY = ph.y + ph.h / 2 + offsetX * Math.sin(photoRotation) + offsetY * Math.cos(photoRotation);
    place(pieces.tape,tapeCenterX-tapeWidth/2,tapeCenterY-tapeHeight/2,tapeWidth,tapeHeight,photoAngle+48,1.9);
    place(pieces.spoon,mix(W*.55,W*.63),mix(heroH*.035,0),W*.40,W*.40/.93,-8,1.45);
    place(pieces.eye,mix(W*.69,W*.60),mix(heroH*.46,openH*.14),W*.34,W*.34/2.2,12,1.65);
    place(pieces.croissant,mix(W*.60,W*.65),mix(heroH-W*.43/1.27-18,openH-W*.43/1.27-18),W*.43,W*.43/1.27,12,1.5);
    place(pieces.danish,mix(W*.01,0),mix(heroH-W*.42/1.09-16,openH-W*.42/1.09-16),W*.42,W*.42/1.09,-12,1.65);
    place(pieces.arrow,mix(0,-W*.02),mix(heroH*.54,openH*.52),W*.26,W*.26/1.35,-19,1.3);
    place(pieces.seal,mix(W*.43,W*.44),mix(heroH*.02,openH*.035),W*.28,W*.28,10,2.1);
    place(pieces.beans,W*.03,mix(heroH*.46,openH*.49),W*.13,W*.13/1.1,-14,2.1);
    place(pieces.checks,W*.85,mix(heroH*.34,openH*.32),W*.16,W*.16/2.1,9,2.6);
    place(pieces.coffeeStamp,W*.43,H-W*.17-8,W*.17,W*.17,7,2.4);
    const c=place(cup,W*.18,mix(heroH*.18,openH*.26),W*.80,W*.80,-2,1.9);
    const paper=root.querySelector('.z5-paper');Object.assign(paper.style,{left:W*.10+'px',top:(H-heroH*.80)/2+'px',width:W*.80+'px',height:heroH*.80+'px'});
    const cardWidth=W*.88;
    result.style.left=(W-cardWidth)/2+'px';
    result.style.width=cardWidth+'px';
    const cardTop=offset+Math.max(112,H*.24)*scale;
    const latestCardTop=availableHeight-result.offsetHeight-12;
    result.style.top=Math.max(5,Math.min(cardTop,latestCardTop))+'px';
    root.querySelectorAll('.z5-coffee-drop').forEach((el,i)=>{el.style.left=c.x+c.w*.24+i*14+'px';el.style.top=Math.min(H-30,c.y+c.w*.69+i*13+Math.max(0,frameIndex-2)*9)+'px';el.style.transform='rotate('+(i*11-15)+'deg)';});
  }
  function setSpread(value){spread=value;layout();}
  function frame(index){frameIndex=index;cupFrame.dataset.cupFrame=String(index);cupFrame.style.backgroundPosition=(index%4*100/3)+'% '+Math.floor(index/4)*50+'%';screen.dataset.pouring=String(view==='animating'&&index>=2&&index<=4);layout();}
  function hideExtras(){extras.forEach(el=>{el.dataset.active='false';delete el.dataset.pop;});}
  function selectExtras(){hideExtras();const pairs=[['beans','checks'],['coffeeStamp','beans'],['checks','coffeeStamp']];return pairs[cycle++%pairs.length].map(name=>pieces[name]);}
  function showExtra(el,delay){later(()=>{el.dataset.active='true';el.dataset.pop='0';},delay);later(()=>{el.dataset.pop='1';},delay+85);later(()=>{el.dataset.pop='2';},delay+175);}
  function renderStable(){screen.dataset.view=view;screen.dataset.busy='false';main.disabled=false;back.disabled=false;main.setAttribute('aria-busy','false');result.hidden=view!=='result';back.hidden=view!=='result';main.textContent=view==='result'?'Другой знак':'Перевернуть кружку';description.textContent=view==='result'?'Пусть так и будет.':'Какой сегодня будет день?';delete result.dataset.pop;setSpread(view==='result'?1:0);frame(view==='result'?11:0);if(view==='hero')hideExtras();}
  function finish(announcement) {
    view = 'result';
    renderStable();
    status.textContent = announcement;
  }
  function turn(){
    clearTimers();
    const { sign: [title, text, stamp], date } = drawSign();
    signTitle.textContent = title.toLocaleUpperCase('ru-RU');
    signText.textContent = text;
    signStamp.textContent = stamp.toLocaleUpperCase('ru-RU');
    signDate.textContent = date;
    const announcement = title + '. ' + text;

    if (reduced.matches) {
      selectExtras().forEach(el => { el.dataset.active='true'; el.dataset.pop='2'; });
      finish(announcement);
      return;
    }
    view='animating';screen.dataset.view='clearing';screen.dataset.busy='true';main.disabled=true;back.disabled=true;main.setAttribute('aria-busy','true');result.hidden=true;hideExtras();frame(0);setSpread(0);description.textContent='Сейчас всё выясним.';status.textContent='Кружка переворачивается.';
    [.18,.43,.72,1].forEach((v,i)=>later(()=>setSpread(v),i*150));
    selectExtras().forEach((el,i)=>showExtra(el,180+i*160));
    later(()=>{screen.dataset.view='turning';},620);
    for(let i=0;i<12;i++)later(()=>frame(i),620+i*115);
    later(()=>{screen.dataset.view='revealing';screen.dataset.pouring='false';result.hidden=false;layout();result.dataset.pop='0';},2100);
    later(()=>{result.dataset.pop='1';},2250);later(()=>{result.dataset.pop='2';},2400);later(()=>finish(announcement),2550);
  }
  function reset(callback){clearTimers();view='returning';screen.dataset.view='returning';screen.dataset.busy='true';result.hidden=true;main.disabled=true;back.disabled=true;frame(0);hideExtras();if(reduced.matches){view='hero';renderStable();callback?.();return;}[.72,.43,.18,0].forEach((v,i)=>later(()=>setSpread(v),i*140));later(()=>{view='hero';renderStable();status.textContent='';callback?.();},580);}
  main.addEventListener('click',()=>{if(view==='result')reset(turn);else turn();});
  back.addEventListener('click',()=>reset());
  renderStable();if(view==='result'){pieces.beans.dataset.active='true';pieces.beans.dataset.pop='2';pieces.checks.dataset.active='true';pieces.checks.dataset.pop='2';}
  const observer=new ResizeObserver(layout);
  observer.observe(stage);
})();
</script>
